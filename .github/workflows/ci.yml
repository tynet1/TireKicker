# Typecheck and the full test suite (including the database tests) on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gc
          POSTGRES_PASSWORD: gctest
          POSTGRES_DB: gc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gc -d gc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # The tests drop and recreate this database's schema; it only exists for this job.
      TEST_DATABASE_URL: postgres://gc:gctest@localhost:5432/gc_test
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Chromium for the PDF tests (the same headless shell the Docker image uses).
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run typecheck
      - run: npm test
