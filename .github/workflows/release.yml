# A version tag (v0.2.0) runs the tests, publishes the Docker image to GitHub's container registry
# (ghcr.io/<owner>/tirekicker:0.2.0, :0.2 and :latest) and creates the GitHub Release from CHANGELOG.md.
# How to cut a release: docs/RELEASING.md.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches package.json and compose.release.yml
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json ($want)."; exit 1
          fi
          if ! grep -qF "tirekicker:\${TIREKICKER_VERSION:-${GITHUB_REF_NAME#v}}" compose.release.yml; then
            echo "compose.release.yml doesn't pin ${GITHUB_REF_NAME#v}."; exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tirekicker
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=TireKicker
            org.opencontainers.image.description=Phone-first vehicle inspections
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" 'index($0, "## [" v "]") == 1 {on = 1; next} /^## \[/ || /^\[[0-9]/ {on = 0} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "CHANGELOG.md has no section for $v."; exit 1; fi
          {
            echo
            echo "**Image:** \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tirekicker:$v\` (see docs/DEPLOY.md §6 to update)."
          } >> notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "TireKicker $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
